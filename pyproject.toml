[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "train-doctor"
version = "0.1.2"
description = "Give your agent a way to find out why a training run is slow, fix it, and prove the speedup."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Abel Yagubyan" }]
requires-python = ">=3.11"
keywords = ["pytorch", "profiling", "benchmark", "training", "mcp", "agents"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "mcp>=1.2",
    "psutil>=5.9",
]

[project.urls]
Homepage = "https://github.com/Abelo9996/train-doctor"

[project.scripts]
train-doctor = "train_doctor.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.hatch.build.targets.wheel]
packages = ["src/train_doctor"]

[tool.hatch.build.targets.wheel.force-include]
"skills/train-doctor/SKILL.md" = "train_doctor/skill/SKILL.md"

[tool.hatch.build.targets.sdist]
include = ["src", "skills", "tests", "examples", "README.md", "LICENSE", "CHANGELOG.md"]
exclude = ["examples/*/runs"]

[tool.ruff]
line-length = 140
target-version = "py311"
extend-exclude = ["examples/*/runs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "SIM105", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["torch: needs PyTorch installed"]
